apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # K3s imports *.server from this optional ConfigMap. Keep its generated
  # Corefile untouched, and send only private site names to the LAN resolver.
  beary.server: |
    beary.cloud:53 {
        errors
        cache 30
        forward . 10.8.10.92
    }
