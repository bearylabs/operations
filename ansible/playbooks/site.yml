---
- name: Common setup
  hosts: cluster
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - curl
          - wget
          - qemu-guest-agent
          - nfs-common
        state: present

    - name: Start and enable qemu-guest-agent
      service:
        name: qemu-guest-agent
        state: started
        enabled: true

    - name: Disable swap
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Remove swap from fstab
      lineinfile:
        path: /etc/fstab
        regexp: '\sswap\s'
        state: absent

    - name: Load br_netfilter module
      modprobe:
        name: br_netfilter
        state: present

    - name: Persist br_netfilter on boot
      copy:
        content: "br_netfilter\n"
        dest: /etc/modules-load.d/br_netfilter.conf

    - name: Set required sysctl values
      sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables

- name: Configure node DNS without a Kubernetes bootstrap dependency
  hosts: cluster
  tags: node_dns
  become: true
  tasks:
    - name: Create DNS configuration directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/systemd/resolved.conf.d
        - /etc/systemd/network/10-netplan-eth0.network.d

    - name: Remove obsolete DNS overrides
      file:
        path: "/etc/systemd/resolved.conf.d/{{ item }}"
        state: absent
      loop:
        - 10-custom.conf
        - override.conf
      notify: Restart systemd-resolved

    - name: Use independent upstreams for node bootstrap and image pulls
      copy:
        dest: /etc/systemd/resolved.conf.d/90-operations-bootstrap.conf
        mode: "0644"
        content: |
          [Resolve]
          DNS=
          DNS=1.1.1.1 1.0.0.1
          Domains=
          Domains=~.
      notify: Restart systemd-resolved

    - name: Persist site-only DNS routing on the nodes' eth0 link
      copy:
        dest: /etc/systemd/network/10-netplan-eth0.network.d/90-operations-dns.conf
        mode: "0644"
        content: |
          [Network]
          DNS=
          DNS=10.8.10.92
          Domains=
          Domains=~beary.cloud
      register: site_dns_link

    - name: Reload networkd configuration without reconnecting eth0
      command: networkctl reload
      when: site_dns_link.changed

    - name: Apply resolver service changes before configuring the running link
      meta: flush_handlers

    - name: Apply site DNS on the running link
      command: resolvectl dns eth0 10.8.10.92
      changed_when: false

    - name: Apply site-only DNS routing on the running link
      command: resolvectl domain eth0 '~beary.cloud'
      changed_when: false

  handlers:
    - name: Restart systemd-resolved
      service:
        name: systemd-resolved
        state: restarted

- name: Install k3s server
  hosts: control_plane
  become: true
  tasks:
    - name: Install k3s server
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server \
          --disable traefik \
          --disable servicelb \
          --node-ip {{ control_plane_ip }} \
          --tls-san {{ control_plane_ip }}
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for node-token
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: Read node-token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw

    - name: Store token as fact
      set_fact:
        k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"

    - name: Fetch kubeconfig
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ~/.kube/config-dus-prod
        flat: true

    - name: Fix kubeconfig server address
      delegate_to: localhost
      become: false
      replace:
        path: ~/.kube/config-dus-prod
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ control_plane_ip }}:6443"

- name: Install k3s agents
  hosts: workers
  become: true
  tasks:
    - name: Install k3s agent
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" \
          K3S_URL="https://{{ control_plane_ip }}:6443" \
          K3S_TOKEN="{{ hostvars[groups['control_plane'][0]]['k3s_token'] }}" \
          sh -
      args:
        creates: /usr/local/bin/k3s
